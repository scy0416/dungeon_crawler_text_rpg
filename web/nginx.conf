server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker 내장 DNS. 변수로 proxy_pass 하면 기동 시점이 아니라 요청 시점에 gateway 주소를 찾는다
    # (gateway가 늦게 뜨거나 재생성돼 IP가 바뀌어도 동작)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;

    # 웹 클라이언트는 Gateway만 호출한다: /api/characters → gateway:8000/characters
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
