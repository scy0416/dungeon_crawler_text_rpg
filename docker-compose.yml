x-db-service: &db-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# 호스트에는 웹 클라이언트(8080)와 Gateway(8000)만 연다. 내부 서비스는 --scale로 여러 개 띄울 수 있다.
# 내부 서비스/Redis에 직접 접근하려면: docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
services:
  # 웹 클라이언트 (정적 파일 + /api/* 를 Gateway로 프록시). 브라우저에서 http://localhost:8080
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    environment:
      GATEWAY_UPSTREAM: gateway:8000
      # Docker 내장 DNS. 요청 시점에 gateway 주소를 찾으므로 gateway가 재생성돼도 동작한다
      NGINX_RESOLVER: 127.0.0.11
    depends_on:
      - gateway

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      CHARACTER_SERVICE_URL: http://character-service:8002
      DUNGEON_SERVICE_URL: http://dungeon-service:8003
      QUEST_SERVICE_URL: http://quest-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    depends_on:
      - auth-service
      - character-service
      - dungeon-service
      - quest-service
      - notification-service

  auth-service:
    <<: *db-service
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}

  character-service:
    <<: *db-service
    build:
      context: .
      dockerfile: character-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://character_user:${CHARACTER_DB_PASSWORD}@postgres:5432/character_db
      REDIS_URL: redis://redis:6379/0

  dungeon-service:
    <<: *db-service
    build:
      context: .
      dockerfile: dungeon-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dungeon_user:${DUNGEON_DB_PASSWORD}@postgres:5432/dungeon_db
      REDIS_URL: redis://redis:6379/0
      CHARACTER_SERVICE_URL: http://character-service:8002

  quest-service:
    <<: *db-service
    build:
      context: .
      dockerfile: quest-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://quest_user:${QUEST_DB_PASSWORD}@postgres:5432/quest_db
      REDIS_URL: redis://redis:6379/0
      CHARACTER_SERVICE_URL: http://character-service:8002

  notification-service:
    <<: *db-service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379/0
      CHARACTER_SERVICE_URL: http://character-service:8002

  postgres:
    build:
      context: infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CHARACTER_DB_PASSWORD: ${CHARACTER_DB_PASSWORD}
      DUNGEON_DB_PASSWORD: ${DUNGEON_DB_PASSWORD}
      QUEST_DB_PASSWORD: ${QUEST_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
