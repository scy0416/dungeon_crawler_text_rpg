x-db-service: &db-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      CHARACTER_SERVICE_URL: http://character-service:8002
      DUNGEON_SERVICE_URL: http://dungeon-service:8003
      QUEST_SERVICE_URL: http://quest-service:8004
    depends_on:
      - auth-service
      - character-service
      - dungeon-service
      - quest-service

  auth-service:
    <<: *db-service
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}

  character-service:
    <<: *db-service
    build:
      context: .
      dockerfile: character-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://character_user:${CHARACTER_DB_PASSWORD}@postgres:5432/character_db
      REDIS_URL: redis://redis:6379/0
      # 재시작해도 같은 이름을 써야 pending 메시지를 이어받는다 (다중 인스턴스 시 인스턴스별로 달라야 함)
      CONSUMER_NAME: character-service-1

  dungeon-service:
    <<: *db-service
    build:
      context: .
      dockerfile: dungeon-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://dungeon_user:${DUNGEON_DB_PASSWORD}@postgres:5432/dungeon_db
      REDIS_URL: redis://redis:6379/0
      CHARACTER_SERVICE_URL: http://character-service:8002

  quest-service:
    <<: *db-service
    build:
      context: .
      dockerfile: quest-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://quest_user:${QUEST_DB_PASSWORD}@postgres:5432/quest_db
      REDIS_URL: redis://redis:6379/0
      CHARACTER_SERVICE_URL: http://character-service:8002
      CONSUMER_NAME: quest-service-1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CHARACTER_DB_PASSWORD: ${CHARACTER_DB_PASSWORD}
      DUNGEON_DB_PASSWORD: ${DUNGEON_DB_PASSWORD}
      QUEST_DB_PASSWORD: ${QUEST_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
